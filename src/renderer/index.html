<!-- PeaceD OPC - Nguyen Huu Dung -->
<!doctype html>
<html class="native-shell">
  <head>
    <meta charset="UTF-8" />
    <title>PeaceD OPC</title>
    <!-- CSP is relaxed during development; electron-vite injects a stricter policy for production builds -->
    <style>
      :root {
        --splash-bg: #0d0d0e;
        --splash-surface: #141416;
        --splash-surface-elevated: #1a1a1e;
        --splash-fg: #f5f5f5;
        --splash-muted: #73737a;
        --splash-primary: #3b82f6;
        --splash-border: rgba(255, 255, 255, 0.08);
        --splash-glass: rgba(255, 255, 255, 0.04);
        --splash-shimmer: rgba(255, 255, 255, 0.06);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --splash-bg: #f8f9fa;
          --splash-surface: #ffffff;
          --splash-surface-elevated: #f1f3f5;
          --splash-fg: #171717;
          --splash-muted: #868e96;
          --splash-primary: #2563eb;
          --splash-border: rgba(0, 0, 0, 0.08);
          --splash-glass: rgba(0, 0, 0, 0.03);
          --splash-shimmer: rgba(0, 0, 0, 0.05);
        }
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: var(--splash-bg);
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      .app-startup-shell {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        background-color: var(--splash-bg);
        color: var(--splash-fg);
        z-index: 99999;
      }
      /* Titlebar */
      .splash-titlebar {
        height: 36px;
        background-color: var(--splash-surface);
        border-bottom: 1px solid var(--splash-border);
        display: flex;
        align-items: center;
        padding: 0 12px;
        gap: 10px;
        -webkit-app-region: drag;
      }
      .splash-brand-icon {
        width: 14px;
        height: 14px;
        border-radius: 3px;
        background: linear-gradient(135deg, var(--splash-primary), #60a5fa);
        flex-shrink: 0;
      }
      .splash-titlebar-title {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--splash-fg);
        opacity: 0.9;
      }
      .splash-breadcrumb-pill {
        height: 20px;
        width: 120px;
        background-color: var(--splash-glass);
        border: 1px solid var(--splash-border);
        border-radius: 9999px;
        animation: splash-shimmer 2s ease-in-out infinite;
      }
      .splash-window-controls-spacer {
        margin-left: auto;
        width: 138px;
        height: 100%;
      }
      /* Body: Sidebar + Main Area */
      .splash-body {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      .splash-sidebar {
        width: 48px;
        background-color: var(--splash-surface);
        border-right: 1px solid var(--splash-border);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 12px 0;
        gap: 16px;
      }
      .splash-nav-icon {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        background-color: var(--splash-glass);
        border: 1px solid var(--splash-border);
        animation: splash-shimmer 2s ease-in-out infinite;
      }
      .splash-nav-icon.active {
        background-color: var(--splash-primary);
        opacity: 0.85;
      }
      .splash-sidebar-bottom {
        margin-top: auto;
      }
      .splash-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      /* Tab bar */
      .splash-tabbar {
        height: 36px;
        background-color: var(--splash-surface);
        border-bottom: 1px solid var(--splash-border);
        display: flex;
        align-items: center;
        padding: 0 8px;
        gap: 6px;
      }
      .splash-tab {
        height: 26px;
        width: 130px;
        background-color: var(--splash-bg);
        border: 1px solid var(--splash-border);
        border-radius: 6px;
        display: flex;
        align-items: center;
        padding: 0 8px;
        gap: 6px;
      }
      .splash-tab-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: var(--splash-primary);
      }
      .splash-tab-text {
        height: 8px;
        width: 60px;
        border-radius: 3px;
        background-color: var(--splash-muted);
        opacity: 0.4;
      }
      /* Center Workspace View */
      .splash-workspace {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px;
        position: relative;
      }
      .splash-logo-container {
        position: relative;
        width: 52px;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 18px;
      }
      .splash-glow {
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(59, 130, 246, 0.3) 0%, transparent 70%);
        animation: splash-pulse 2.2s ease-in-out infinite;
      }
      .splash-spinner {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 2.5px solid var(--splash-border);
        border-top-color: var(--splash-primary);
        animation: splash-spin 0.85s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
      }
      .splash-title {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin-bottom: 6px;
        color: var(--splash-fg);
      }
      .splash-subtitle {
        font-size: 12px;
        color: var(--splash-muted);
        letter-spacing: 0.01em;
        margin-bottom: 18px;
      }
      /* Linear Progress Bar */
      .splash-progress-track {
        width: 180px;
        height: 3px;
        border-radius: 9999px;
        background-color: var(--splash-border);
        overflow: hidden;
        position: relative;
      }
      .splash-progress-beam {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 40%;
        border-radius: 9999px;
        background: linear-gradient(90deg, transparent, var(--splash-primary), transparent);
        animation: splash-beam 1.4s ease-in-out infinite;
      }
      /* Recovery button (hidden until 12s timeout) */
      .splash-recovery-button {
        display: none;
        margin-top: 16px;
        padding: 6px 14px;
        border-radius: 6px;
        border: 1px solid var(--splash-border);
        background-color: var(--splash-surface);
        color: var(--splash-fg);
        font-size: 11px;
        font-weight: 500;
        cursor: pointer;
        opacity: 0.85;
        transition: opacity 0.15s ease;
      }
      .splash-recovery-button:hover {
        opacity: 1;
      }
      /* Status bar */
      .splash-statusbar {
        height: 24px;
        background-color: var(--splash-surface);
        border-top: 1px solid var(--splash-border);
        display: flex;
        align-items: center;
        padding: 0 12px;
        gap: 12px;
      }
      .splash-status-item {
        height: 8px;
        width: 50px;
        border-radius: 3px;
        background-color: var(--splash-muted);
        opacity: 0.3;
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes splash-pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.95); }
        50% { opacity: 0.95; transform: scale(1.1); }
      }
      @keyframes splash-beam {
        0% { left: -40%; }
        100% { left: 100%; }
      }
      @keyframes splash-shimmer {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="app-startup-shell" aria-label="Khởi động PeaceD OPC">
        <!-- Native Titlebar Skeleton -->
        <div class="splash-titlebar">
          <div class="splash-brand-icon"></div>
          <span class="splash-titlebar-title">PeaceD OPC</span>
          <div class="splash-breadcrumb-pill"></div>
          <div class="splash-window-controls-spacer"></div>
        </div>
        <!-- Body: Sidebar + Main Content -->
        <div class="splash-body">
          <div class="splash-sidebar">
            <div class="splash-nav-icon active"></div>
            <div class="splash-nav-icon"></div>
            <div class="splash-nav-icon"></div>
            <div class="splash-nav-icon"></div>
            <div class="splash-sidebar-bottom">
              <div class="splash-nav-icon"></div>
            </div>
          </div>
          <div class="splash-main">
            <div class="splash-tabbar">
              <div class="splash-tab">
                <div class="splash-tab-dot"></div>
                <div class="splash-tab-text"></div>
              </div>
            </div>
            <div class="splash-workspace">
              <div class="splash-logo-container">
                <div class="splash-glow"></div>
                <div class="splash-spinner"></div>
              </div>
              <div class="splash-title">PeaceD OPC</div>
              <div class="splash-subtitle">Đang nạp không gian làm việc...</div>
              <div class="splash-progress-track">
                <div class="splash-progress-beam"></div>
              </div>
              <button
                id="splash-recovery-btn"
                class="splash-recovery-button"
                type="button"
                onclick="window.location.reload()"
              >
                Tải lại ứng dụng
              </button>
            </div>
          </div>
        </div>
        <!-- Native Statusbar Skeleton -->
        <div class="splash-statusbar">
          <div class="splash-status-item"></div>
          <div class="splash-status-item" style="width: 70px;"></div>
          <div class="splash-status-item" style="margin-left: auto; width: 40px;"></div>
        </div>
      </div>
      <script>
        setTimeout(function() {
          var btn = document.getElementById('splash-recovery-btn');
          if (btn) btn.style.display = 'block';
        }, 12000);
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

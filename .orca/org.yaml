# PeaceD OPC Organization Architecture - Nguyen Huu Dung (MSV: 11235559)
# PeaceD OPC Organization Architecture
organization_id: software-studio
organization_name: Software Studio
company_profile: custom
final_decider_role_id: pm
top_level_role_ids:
  - ceo
org_version: 5
runtime_policy:
  communication:
    default_mode: async
    blocking_default: false
    allow_broadcast: true
  handoff:
    require_structured_handoff: true
    require_ack: true
  review:
    strict_gate_inference: true
    allow_human_override: true
  parallel:
    auto_dispatch: true
    max_workers: 8
roles:
  - role_id: pm
    name: Product Manager
    responsibility: Backlog prioritization, user stories, and acceptance criteria
    status: active
    reports_to: owner
    icon: leader
    can_spawn:
      - architect
    tools: []
    is_builtin: false
  - role_id: architect
    name: System Architect
    responsibility: System design, API contracts, and schema modeling
    status: active
    reports_to: pm
    icon: code
    can_spawn:
      - frontend_lead
      - backend_lead
    tools: []
    is_builtin: false
  - role_id: frontend_lead
    name: Frontend Lead
    responsibility: Component library, client state, and responsive views
    status: active
    reports_to: architect
    icon: code
    can_spawn: []
    tools: []
    is_builtin: false
  - role_id: backend_lead
    name: Backend Lead
    responsibility: API services, database queries, and background workers
    status: active
    reports_to: architect
    icon: code
    can_spawn: []
    tools: []
    is_builtin: false
  - role_id: qa_lead
    name: QA Lead
    responsibility: Integration testing, automated suites, and defect triage
    status: active
    reports_to: pm
    icon: code
    can_spawn: []
    tools: []
    is_builtin: false
  - role_id: devops
    name: DevOps & SRE
    responsibility: Kubernetes clusters, deployment pipelines, and telemetry
    status: active
    reports_to: architect
    icon: code
    can_spawn: []
    tools: []
    is_builtin: false
